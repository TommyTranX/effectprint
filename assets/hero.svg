<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Effectprint catches a WebMCP behavioral contract violation</title>
  <desc id="desc">A read-only search tool attempts a hidden checkout. Effectprint blocks the POST request and reports the violation.</desc>
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientTransform="translate(160 10) rotate(30) scale(900 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15352c"/>
      <stop offset=".55" stop-color="#090c11"/>
      <stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="72" fill="#7cdcf3" font-size="22" font-weight="700" letter-spacing="5">EFFECTPRINT</text>
    <text x="64" y="142" fill="#f6f8fb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="760" letter-spacing="-2">Your tool passed its schema test.</text>
    <text x="64" y="202" fill="#f6f8fb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="760" letter-spacing="-2">It still charged the card.</text>
    <g filter="url(#shadow)">
      <rect x="64" y="252" width="1072" height="302" rx="18" fill="#11161e" stroke="#29313e"/>
      <rect x="64" y="252" width="7" height="302" rx="3.5" fill="#ff6577"/>
      <circle cx="102" cy="288" r="6" fill="#ff6577"/>
      <circle cx="124" cy="288" r="6" fill="#f7c66b"/>
      <circle cx="146" cy="288" r="6" fill="#42d392"/>
      <text x="98" y="346" fill="#f5f7fb" font-size="23" font-weight="700">search_products</text>
      <rect x="907" y="320" width="174" height="38" rx="19" fill="#34141c" stroke="#7a2f40"/>
      <text x="994" y="346" fill="#ff6577" font-size="15" font-weight="700" text-anchor="middle">CONTRACT FAILED</text>
      <line x1="98" y1="378" x2="1098" y2="378" stroke="#29313e"/>
      <text x="98" y="421" fill="#9eabba" font-size="17">claimed</text>
      <text x="238" y="421" fill="#f5f7fb" font-size="17">readOnlyHint: true</text>
      <text x="98" y="466" fill="#9eabba" font-size="17">observed</text>
      <text x="238" y="466" fill="#ff8a98" font-size="17" font-weight="700">POST /api/checkout</text>
      <rect x="879" y="441" width="128" height="34" rx="17" fill="#34290f"/>
      <text x="943" y="464" fill="#f7c66b" font-size="14" font-weight="700" text-anchor="middle">BLOCKED</text>
      <text x="98" y="514" fill="#42d392" font-size="16">✓ zero purchases reached the server</text>
    </g>
    <text x="64" y="598" fill="#9eabba" font-size="17">effectprint demo</text>
    <text x="1136" y="598" fill="#9eabba" font-size="17" text-anchor="end">behavioral checks for WebMCP tools</text>
  </g>
</svg>
