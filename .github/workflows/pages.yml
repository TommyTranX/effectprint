name: Documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6.0.0
      - name: Assemble static site
        run: |
          mkdir -p _site/docs _site/schemas _site/assets
          cp site/index.html site/index.md site/sample-report.html site/robots.txt site/sitemap.xml _site/
          cp README.md llms.txt CHANGELOG.md SECURITY.md CONTRIBUTING.md CITATION.cff _site/
          cp docs/*.md _site/docs/
          cp schemas/*.json _site/schemas/
          cp assets/* _site/assets/
      - uses: actions/upload-pages-artifact@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public discovery surfaces
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          SITE_ROOT="${SITE_URL%/}/"
          curl --fail --silent --show-error --location "${SITE_ROOT}" > /dev/null
          curl --fail --silent --show-error --location "${SITE_ROOT}llms.txt" | grep -q "# Effectprint"
          curl --fail --silent --show-error --location "${SITE_ROOT}sample-report.html" | grep -q "READ_ONLY_MUTATION"
          curl --fail --silent --show-error --location "${SITE_ROOT}sitemap.xml" | grep -q "sample-report.html"
